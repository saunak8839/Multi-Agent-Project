services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-support_desk}
      POSTGRES_USER: ${POSTGRES_USER:-support_desk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support_desk}
    ports:
      - "5432:5432"
    volumes:
      - support-desk-postgres:/var/lib/postgresql/data
      - ./data/seed/000_enable_vector.sql:/docker-entrypoint-initdb.d/000_enable_vector.sql:ro
      - ./data/seed/001_seed.sql:/docker-entrypoint-initdb.d/001_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-support_desk} -d ${POSTGRES_DB:-support_desk}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  support-desk-postgres:
